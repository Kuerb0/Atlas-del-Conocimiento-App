<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Árbol de la estadística</title>
<link rel="icon" type="image/png" href="__ICONO__">
<style>
/* Visor del árbol: mapa 3D (núcleo + ramas en órbita), buscador y panel de código. Un solo fichero, sin internet. */
:root {
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E9EDF3; --ink:#111B2E; --muted:#566178; --line:#D3DAE4;
  --accent:#1F58C4; --accent-ink:#FFFFFF; --danger:#B3361F; --danger-bg:#FBEAE6; --on-leaf:#FFFFFF;
  --c-preprocesado:#137A6E; --c-seleccion:#6B3DB5; --c-modelos:#2458C8; --c-diagnostico:#BF3D26;
  --c-clustering:#2F7F3B; --c-contrastes:#96590A; --c-guias:#4D5B72;
  --c-graficos:#7A6A00; --c-demos:#0E7490;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --apag:#898781; --rej:#e1e0d9;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Code","SF Mono",Consolas,"Liberation Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E1520; --surface:#162131; --surface-2:#1D2B3F; --ink:#E6ECF5; --muted:#9AA7BD; --line:#2A3A52;
  --accent:#6FA2FF; --accent-ink:#0E1520; --danger:#FF8A73; --danger-bg:#3A1F1A; --on-leaf:#0E1520;
  --c-preprocesado:#45C3B3; --c-seleccion:#B18CF0; --c-modelos:#6FA2FF; --c-diagnostico:#FF8A73;
  --c-clustering:#6FCF7B; --c-contrastes:#E5A23A; --c-guias:#93A3BD; color-scheme:dark;
  --c-graficos:#D4BD45; --c-demos:#4FC3DC; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --rej:#2c2c2a; } }
:root[data-theme="dark"]{
  --bg:#0E1520; --surface:#162131; --surface-2:#1D2B3F; --ink:#E6ECF5; --muted:#9AA7BD; --line:#2A3A52;
  --accent:#6FA2FF; --accent-ink:#0E1520; --danger:#FF8A73; --danger-bg:#3A1F1A; --on-leaf:#0E1520;
  --c-preprocesado:#45C3B3; --c-seleccion:#B18CF0; --c-modelos:#6FA2FF; --c-diagnostico:#FF8A73;
  --c-clustering:#6FCF7B; --c-contrastes:#E5A23A; --c-guias:#93A3BD; color-scheme:dark;
  --c-graficos:#D4BD45; --c-demos:#4FC3DC; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --rej:#2c2c2a; }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,pre{font-family:var(--mono)}

.app{display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);height:100%;min-height:420px}
.top{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;padding:6px 8px;min-width:0}
.brand{display:flex;min-width:0;flex:none}
.brand h1{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em;cursor:default}
.search{position:relative;flex:0 1 260px;min-width:150px}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;translate:0 -50%;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.resultados{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);max-height:min(60vh,420px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:4px;margin:0;list-style:none}
.resultados li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:2px 10px;padding:7px 8px;border-radius:6px;cursor:pointer}
.resultados li[aria-selected="true"],.resultados li:hover{background:var(--surface-2)}
.resultados .pt{grid-row:1/3;align-self:start;margin-top:5px;width:10px;height:10px;border-radius:50%}
.resultados .n{font-family:var(--mono);font-size:13px;font-weight:600;overflow-wrap:anywhere}
.resultados .d{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resultados .sec{display:block;padding:8px 8px 4px;color:var(--muted);font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;cursor:default}
.resultados .col{font:600 10px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:6px}
.resultados .vacio{display:block;padding:10px;color:var(--muted);cursor:default}
.tools{display:flex;align-items:center;gap:4px;margin-left:auto;flex:none}
.btn.ic{padding:5px 9px;font-size:13px;line-height:1.2}
.btn[aria-pressed="true"]{background:var(--surface-2);border-color:var(--muted)}
.filtros{position:relative} .filtros summary{list-style:none} .filtros summary::-webkit-details-marker{display:none}
.filtros .pop{position:absolute;right:0;top:calc(100% + 4px);z-index:30;width:300px;display:grid;gap:8px;padding:10px 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.18);font-size:12.5px}
.filtros .pop p{margin:0;color:var(--muted);font-size:12px}
.chk{display:flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primario{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primario:hover{filter:brightness(1.08)}

.ramas{display:flex;flex-wrap:nowrap;gap:5px;flex:1 1 auto;min-width:0;overflow-x:auto;scrollbar-width:thin;padding:2px 0}
.ramas .chip{flex:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface);cursor:pointer;font-size:12.5px}
.chip:hover,.chip[aria-pressed="true"]{background:var(--surface-2);border-color:var(--muted)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip b{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

.cuerpo{display:grid;grid-template-columns:minmax(0,1fr) 14px var(--ancho-det,430px);padding:0 8px 8px;min-height:0}
.divisor{position:relative;cursor:col-resize;touch-action:none;outline:none}
.divisor::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:4px;border-radius:2px;background:transparent;transition:background .15s}
.divisor::after{content:"";position:absolute;left:4px;top:50%;width:6px;height:36px;margin-top:-18px;border-radius:3px;background:var(--line)}
.divisor:hover::before,.divisor:focus-visible::before,.divisor.arrastrando::before{background:var(--accent)}
.cuerpo.sin-detalle{grid-template-columns:minmax(0,1fr) 14px 0} .cuerpo.sin-detalle .detalle{display:none}
.lienzo{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:#03040a;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.migas{position:absolute;left:8px;top:8px;z-index:5;max-width:calc(100% - 16px);display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;padding:3px 8px;
  border-radius:8px;background:rgba(8,10,18,.72);font-size:12.5px;color:#8f9bb3}
.migas button{background:none;border:0;padding:2px 4px;border-radius:4px;cursor:pointer;color:#8fb4ff}
.migas button:hover{background:rgba(255,255,255,.1)}
.migas span.act{color:#fff;font-weight:600;padding:2px 4px}
#cerebro{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block;background:#03040a;outline:none}
#cerebro[hidden]{display:none}
.mapa-ctrls[hidden]{display:none}
.mapa3d{flex:1;min-height:0;width:100%;display:block;cursor:grab;background:#03040a;outline:none}
.mapa3d[hidden]{display:none}
.mapa3d:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mapa-ctrls{position:absolute;right:10px;bottom:10px;z-index:5;display:flex;gap:6px}
.mapa-ctrls .btn{background:rgba(8,10,18,.72);border-color:#2a3550;color:#c9d3e6;backdrop-filter:blur(3px)}
.mapa-ctrls .btn:hover{background:rgba(30,40,64,.85)}


.b-preprocesado{--c:var(--c-preprocesado)} .b-seleccion{--c:var(--c-seleccion)} .b-modelos{--c:var(--c-modelos)}
.b-diagnostico{--c:var(--c-diagnostico)} .b-clustering{--c:var(--c-clustering)} .b-contrastes{--c:var(--c-contrastes)} .b-guias{--c:var(--c-guias)}
.b-graficos{--c:var(--c-graficos)} .b-demos{--c:var(--c-demos)}

.detalle{min-width:0;min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.det-cab{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px}
.det-cab i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.detalle h2{margin:6px 0 4px;font-family:var(--mono);font-size:18px;font-weight:650;overflow-wrap:anywhere}
.detalle h3{margin:18px 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:650}
.desc{margin:0 0 12px}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0 0 12px}
.meta dt{color:var(--muted)} .meta dd{margin:0;overflow-wrap:anywhere}
.aviso{margin:0 0 12px;padding:8px 10px;border-radius:8px;background:var(--danger-bg);color:var(--danger);font-size:13px}
.acciones{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
pre.cod,pre.doc{margin:0;padding:12px;border-radius:8px;background:var(--surface-2);overflow:auto;font-size:12.5px;line-height:1.5;tab-size:4}
pre.cod{max-height:420px}
pre.doc{white-space:pre-wrap;overflow-wrap:anywhere;max-height:520px}
.k{color:var(--c-seleccion);font-weight:600} .s{color:var(--c-clustering)} .c{color:var(--muted);font-style:italic} .num{color:var(--c-contrastes)}
.detalle h2.sans{font-family:var(--sans);font-size:19px}
.estado{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;margin:0 0 10px;background:var(--surface-2)}
.estado.con{background:var(--c);color:var(--on-leaf)}
.enlaces{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.enlaces .btn{font-family:var(--mono);font-size:12.5px}
.fuentes{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fuentes li{padding:8px 10px;border:1px solid var(--line);border-radius:8px;display:grid;gap:2px}
.fuentes .tag{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fuentes .tag.vn{color:var(--c-contrastes)}
.fuentes a{color:var(--accent);overflow-wrap:anywhere}
.fuentes .base{color:var(--muted);font-size:12px}
.vacio-det h2{font-family:var(--sans);font-size:17px}
.vacio-det ul{padding-left:18px;margin:8px 0 14px}
.rapidas{display:flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;left:50%;bottom:18px;translate:-50% 0;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}


/* ---------- «Probar»: mini-cuaderno con datos simulados ---------- */
.nb{display:grid;gap:8px;margin:4px 0 6px}
.nb-barra{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nb-estado{font-size:12px;color:var(--muted)}
.nb-celda{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.nb-cab{display:flex;align-items:center;gap:6px;padding:3px 6px;background:var(--surface-2);font-size:11.5px;color:var(--muted)}
.nb-cab .btn{padding:2px 9px;font-size:12px}
.nb-cab span{margin-right:auto;font-family:var(--mono)}
.nb-ed{display:block;width:100%;border:0;margin:0;padding:8px 10px;resize:vertical;background:var(--surface);color:var(--ink);
  font:12px/1.5 var(--mono);tab-size:4;white-space:pre;overflow:auto;min-height:3em}
.nb-ed:focus{outline:2px solid var(--accent);outline-offset:-2px}
.nb-sal:empty{display:none}
.nb-sal{border-top:1px solid var(--line);padding:6px 10px;display:grid;gap:6px;overflow-x:auto;font-size:12px}
.nb-sal pre{margin:0;white-space:pre-wrap;font:11.5px/1.45 var(--mono)}
.nb-sal pre.err{color:var(--danger)}
.nb-sal img{max-width:100%;height:auto;border-radius:6px;background:#fff}
.nb-tabla{border-collapse:collapse;font:11.5px var(--mono);font-variant-numeric:tabular-nums}
.nb-tabla th,.nb-tabla td{padding:2px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.nb-tabla thead th{color:var(--muted)}
.nb-nota{font-size:12px;color:var(--muted);margin:0}
/* ---------- demos interactivas («Cómo funciona») ---------- */
.dm{display:grid;gap:10px;margin:6px 0 4px}
.dm-ctrls{display:grid;gap:6px}
.dm-ctrl{display:grid;grid-template-columns:minmax(0,1fr) minmax(90px,140px) 52px;align-items:center;gap:8px;font-size:12.5px}
.dm-ctrl input[type=range]{width:100%;margin:0;accent-color:var(--accent)}
.dm-sel{grid-column:2/4;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12.5px}
.dm-val{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.dm-chk{display:flex;align-items:center;gap:6px;font-size:12.5px}
.dm-bots{display:flex;flex-wrap:wrap;gap:6px}
.dm-svg{display:block;width:100%;height:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.dm-grid{stroke:var(--rej);stroke-width:1} .dm-eje{stroke:var(--line);stroke-width:1}
.dm-tick{fill:var(--muted);font:10px var(--sans)} .dm-etq-eje{fill:var(--muted);font:10.5px var(--sans)}
.dm-txt{fill:var(--ink);font:11px var(--sans)}
.dm-l1,.dm-l2,.dm-l3,.dm-lm,.dm-ltinta,.dm-lfina,.dm-lres{fill:none;stroke-linejoin:round;stroke-linecap:round}
.dm-l1{stroke:var(--s1);stroke-width:2} .dm-l2{stroke:var(--s2);stroke-width:2} .dm-l3{stroke:var(--s3);stroke-width:2}
.dm-lm{stroke:var(--apag);stroke-width:1.5} .dm-ltinta{stroke:var(--ink);stroke-width:2} .dm-lfina{stroke:var(--apag);stroke-width:1}
.dm-lres{stroke:var(--apag);stroke-width:.8;opacity:.6} .dm-fino{stroke-width:1.2}
.dm-f1{fill:var(--s1)} .dm-f2{fill:var(--s2)} .dm-f3{fill:var(--s3)} .dm-fm{fill:var(--apag)}
.dm-op30{fill-opacity:.3} .dm-op35{fill-opacity:.35} .dm-op45{fill-opacity:.45} .dm-op60{fill-opacity:.6} .dm-op70{fill-opacity:.7}
.dm-anillo{stroke:var(--surface);stroke-width:2}
.dm-ley{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.dm-ley i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.dm-ley i.dm-k1{background:var(--s1)} .dm-ley i.dm-k2{background:var(--s2)} .dm-ley i.dm-k3{background:var(--s3)}
.dm-ley i.dm-km{background:var(--apag)} .dm-ley i.dm-kg{background:var(--apag);opacity:.45;height:8px}
.dm-ley i.dm-p1,.dm-ley i.dm-p2,.dm-ley i.dm-pm{width:8px;height:8px;border-radius:50%}
.dm-ley i.dm-p1{background:var(--s1)} .dm-ley i.dm-p2{background:var(--s2)} .dm-ley i.dm-pm{background:var(--apag)}
.dm-lect{font-size:13px;line-height:1.5;padding:8px 10px;border-radius:8px;background:var(--surface-2);display:grid;gap:4px}
.dm-tabla{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.dm-tabla th,.dm-tabla td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}
.dm-tabla th{color:var(--muted);font-weight:600}
.dm-nota{font-size:12.5px;color:var(--muted);line-height:1.45}
.dm-sub{margin:8px 0 2px;font-size:13px}
.dm-galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.dm-tarj{display:grid;gap:4px;align-content:start;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:12px}
.dm-pie{color:var(--muted);font-variant-numeric:tabular-nums} .dm-uso{line-height:1.4}
.dm-ley i.dm-k3{height:3px}
.dm-tabla th:first-child,.dm-tabla td:first-child{text-align:left}
.aprende{margin:0 0 10px;padding:9px 11px;border-left:3px solid var(--c);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:13px}

/* ---------- propiedades: barras 0-10 y perfiles ---------- */
.perfil-sel{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font-size:12.5px;max-width:190px}
.pp-cab{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:center;margin:4px 0 10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.pp-total{grid-row:1/3;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.pp-total small{font-size:13px;font-weight:600;color:var(--muted)}
.pp-cab .pp-txt{font-size:12.5px;color:var(--muted)} .pp-cab .pp-txt b{color:var(--ink)}
.pp-pc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 8px}
.pp-pc ul{margin:0;padding:8px 10px 8px 26px;border-radius:8px;font-size:12.5px;background:var(--surface-2)}
.pp-pc li{margin:2px 0} .pp-pc .pro::marker{content:"+  ";color:var(--c-clustering);font-weight:700} .pp-pc .con::marker{content:"−  ";color:var(--danger);font-weight:700}
.pp-uso{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;margin:0 0 10px;font-size:12.5px}
.pp-uso dt{font-weight:650} .pp-uso dt.si{color:var(--c-clustering)} .pp-uso dt.no{color:var(--danger)} .pp-uso dd{margin:0}
details.pbloque{border:1px solid var(--line);border-radius:8px;margin:0 0 6px;background:var(--surface)}
details.pbloque>summary{display:grid;grid-template-columns:minmax(120px,1.5fr) minmax(56px,1fr) 30px 56px;gap:8px;align-items:center;padding:6px 10px;cursor:pointer;list-style:none;font-size:12.5px;font-weight:650}
details.pbloque>summary::-webkit-details-marker{display:none}
details.pbloque>summary .pb-t::before{content:"▸ ";color:var(--muted);font-size:10px}
details.pbloque[open]>summary .pb-t::before{content:"▾ "}
.pb-lista{display:grid;gap:3px;padding:2px 10px 8px}
.pb{display:grid;grid-template-columns:minmax(120px,1.5fr) minmax(56px,1fr) 30px 56px;gap:8px;align-items:center;font-size:12.5px}
.pb.poco{opacity:.5}
.pb-n{overflow-wrap:anywhere;line-height:1.25;cursor:help}
.pb-barra{position:relative;height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.pb-barra i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--c,var(--accent))}
.pb-barra.bajo i{background:var(--danger)}
.pb-barra::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.pb-v{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.pb-o{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
.pb-o.medido{color:var(--c-clustering);font-weight:700;cursor:help} .pb-o.tuyo{color:var(--accent);font-weight:700}
.pb-det{grid-column:1/-1;margin:-1px 0 3px;color:var(--muted);font-size:11.5px;padding-left:2px}
.pp-alt{display:grid;gap:4px;margin:0 0 8px}
.pp-alt .fila{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(60px,110px) 34px;gap:8px;align-items:center;font-size:12.5px}
.pp-alt .fila .btn{font-family:var(--mono);font-size:12px;padding:3px 8px;justify-content:flex-start;overflow:hidden;text-overflow:ellipsis}

      pesosMios[inp.dataset.peso] = +inp.value; try { localStorage.setItem('arbol-pesos-mios', JSON.stringify(pesosMios)); } catch (e) {}
      var abierto = caja.querySelector('.pp-pesos'); refrescarPropiedades();
    });
  });
}
function htmlPropiedades(n) {
  var f = n.ficha; if (!f) return '';
  var pf = perfilActual(), pt = puntuacion(n), alts = f.grupo ? ordenGrupo(n) : [], pos = 0;
  alts.forEach(function (a, i) { if (a.h === n) pos = i + 1; });
  var h = '<h3>Propiedades</h3><div class="pp-cab"><span class="pp-total">' + (pt ? fmt(pt.valor) : '–') + '<small> /10</small></span>' +
    '<span class="pp-txt">Con el perfil <b>' + esc(pf.nombre) + '</b> · media ponderada de ' + (pt ? pt.n : 0) + ' propiedades</span>' +
    '<span class="pp-txt">' + (alts.length > 1 ? 'Puesto <b>' + pos + ' de ' + alts.length + '</b> en «' + esc(grupoNombre[f.grupo] || f.grupo) + '»' : (pf.desc ? esc(pf.desc) : '')) + '</span></div>';
  if ((f.pros || []).length || (f.contras || []).length) {
    h += '<div class="pp-pc"><ul>' + (f.pros || []).map(function (x) { return '<li class="pro">' + esc(x) + '</li>'; }).join('') + '</ul>' +
      '<ul>' + ((f.contras || []).length ? f.contras.map(function (x) { return '<li class="con">' + esc(x) + '</li>'; }).join('') : '<li class="con">—</li>') + '</ul></div>';
  }
  if ((f.usar_si && f.usar_si !== '—') || (f.evitar_si && f.evitar_si !== '—'))
    h += '<dl class="pp-uso">' + (f.usar_si && f.usar_si !== '—' ? '<dt class="si">Úsala si</dt><dd>' + esc(f.usar_si) + '</dd>' : '') +
      (f.evitar_si && f.evitar_si !== '—' ? '<dt class="no">Evítala si</dt><dd>' + esc(f.evitar_si) + '</dd>' : '') + '</dl>';
  PROP.bloques.forEach(function (bl, i) { h += filasBloque(bl, f.notas, {abierto: true, detalle: true}); });
  if (perfilId === 'mio') h += editorPesos();
  h += '<p class="pp-nota"><b class="pb-o medido">medido</b> = benchmark o simulación (' + esc(PROP.medido || 'sin medir') + (PROP.equipo ? ', ' + esc(PROP.equipo) : '') + ') · estimado = criterio experto · <b class="pb-o tuyo">tuyo</b> = conceptos/fichas_mias.json. Las propiedades que no aplican no salen.</p>';
  if (alts.length > 1) {
    h += '<h3>Alternativas · ' + esc(grupoNombre[f.grupo] || f.grupo) + '</h3><div class="pp-alt">' + alts.map(function (a, i) {
      return '<div class="fila' + (a.h === n ? ' yo' : '') + '"><span class="pos">' + (i + 1) + '</span><button class="btn" type="button" data-ir="' + esc(a.h.rid) + '">' + esc(a.h.nombre) + '</button>' +
        (a.p ? barra(a.p.valor) + '<span class="pb-v">' + fmt(a.p.valor) + '</span>' : '<span></span><span></span>') + '</div>';
    }).join('') + '</div>';
  }
  var otrosTipo = (fnPorGrupo[f.grupo] || []).filter(function (x) { return esGrafico(x) !== esGrafico(n); });
  if (otrosTipo.length) h += '<h3>' + (esGrafico(n) ? 'Funciones de cálculo del mismo tema' : 'Gráficos del mismo tema') + '</h3><div class="enlaces">' +
    otrosTipo.map(function (x) { return '<button class="btn" type="button" data-ir="' + esc(x.rid) + '">' + esc(x.nombre) + '</button>'; }).join('') + '</div>';
  var otras = hojas.filter(function (x) { return x.tipo === 'funcion' && x !== n; });
  var defecto = (alts.filter(function (a) { return a.h !== n; })[0] || {}).h;
  h += '<h3>Comparar con otra función</h3><div class="pp-cmp"><select id="cmpSel" aria-label="Función para comparar"><option value="">— elige —</option>' +
    (alts.length > 1 ? '<optgroup label="Alternativas">' + alts.filter(function (a) { return a.h !== n; }).map(function (a) { return '<option value="' + esc(a.h.rid) + '">' + esc(a.h.nombre) + '</option>'; }).join('') + '</optgroup>' : '') +
    '<optgroup label="Todas">' + otras.map(function (x) { return '<option value="' + esc(x.rid) + '">' + esc(x.nombre) + '</option>'; }).join('') + '</optgroup></select>' +
    '<div id="cmpOut"></div></div>';
  n._cmpDefecto = defecto ? defecto.rid : '';
  return h;
}
function tablaComparar(a, b) {
  var pa = puntuacion(a), pb = puntuacion(b);
  var h = '<table class="pp-tabla"><thead><tr><th>Propiedad</th><th>' + esc(a.nombre) + '</th><th>' + esc(b.nombre) + '</th></tr></thead><tbody>';
  h += '<tr><td><b>Total (' + esc(perfilActual().nombre) + ')</b></td><td' + (pa && pb && pa.valor > pb.valor ? ' class="gana"' : '') + '>' + (pa ? fmt(pa.valor) : '–') + '</td><td' + (pa && pb && pb.valor > pa.valor ? ' class="gana"' : '') + '>' + (pb ? fmt(pb.valor) : '–') + '</td></tr>';
  PROP.bloques.forEach(function (bl) {
    var props = PROP.propiedades.filter(function (p) { return p.bloque === bl.id && (a.ficha.notas[p.id] || b.ficha.notas[p.id]); });
    if (!props.length) return;
    h += '<tr class="blq"><td colspan="3">' + esc(bl.nombre) + '</td></tr>';
    props.forEach(function (p) {
      var x = a.ficha.notas[p.id], y = b.ficha.notas[p.id];
      h += '<tr><td title="' + esc(p.def) + '">' + esc(p.nombre) + '</td><td' + (x && y && x.nota > y.nota ? ' class="gana"' : '') + '>' + (x ? fmt(x.nota) : 'n/a') +
        '</td><td' + (x && y && y.nota > x.nota ? ' class="gana"' : '') + '>' + (y ? fmt(y.nota) : 'n/a') + '</td></tr>';
    });
  });
  return h + '</tbody></table>';
}
function enlazarComparador(n, d) {
  var s = d.querySelector('#cmpSel'); if (!s) return;
  function pintarCmp() { var o = porNombre[s.value]; d.querySelector('#cmpOut').innerHTML = o ? tablaComparar(n, o) : ''; }
  s.onchange = pintarCmp; if (n._cmpDefecto) { s.value = n._cmpDefecto; pintarCmp(); }
}
/* Ficha de un módulo o de una rama de código: media de sus funciones y ranking con el perfil */
function hojasFuncion(nodo) { var out = []; (function rec(x) { if (x.kind === 'hoja') { if (x.tipo === 'funcion' && x.ficha) out.push(x); } else x.hijos.forEach(rec); })(nodo); return out; }
function detalleGrupoFunciones(nodo) {
  var fs = hojasFuncion(nodo); if (!fs.length) return false;
  vistaModulo = nodo; sel = null; pintar();
  if (window.mostrarDetalle) window.mostrarDetalle();
  var medias = {};
  PROP.propiedades.forEach(function (p) {
    var v = fs.filter(function (h) { return h.ficha.notas[p.id]; }).map(function (h) { return h.ficha.notas[p.id].nota; });
    if (v.length) medias[p.id] = {nota: v.reduce(function (a, b) { return a + b; }, 0) / v.length, origen: 'media', cuantas: v.length,
      detalle: 'media de ' + v.length + ' función' + (v.length > 1 ? 'es' : '')};
  });
  var rk = fs.map(function (h) { return {h: h, p: puntuacion(h)}; }).sort(function (a, b) { return (b.p ? b.p.valor : -1) - (a.p ? a.p.valor : -1); });
  var tot = rk.filter(function (r) { return r.p; }), media = tot.reduce(function (a, r) { return a + r.p.valor; }, 0) / Math.max(tot.length, 1);
  var d = $('#detalle');
  var h = '<div class="det-cab b-' + nodo.rama + '"><i></i><span>' + (nodo.kind === 'modulo' ? esc(nodo.parent.nombre) + ' › ' : '') + (nodo.kind === 'modulo' ? 'módulo' : 'rama') + '</span></div>' +
    '<h2>' + esc(nodo.nombre) + '</h2>' + (nodo.desc ? '<p class="desc">' + esc(nodo.desc) + '</p>' : '') +
    '<div class="pp-cab b-' + nodo.rama + '"><span class="pp-total">' + fmt(media) + '<small> /10</small></span><span class="pp-txt">Media de ' + fs.length + ' funciones con el perfil <b>' + esc(perfilActual().nombre) + '</b></span>' +
    '<span class="pp-txt">Cada barra es la media de las funciones a las que se aplica esa propiedad</span></div>';
  h += '<div class="b-' + nodo.rama + '">';
  PROP.bloques.forEach(function (bl) { h += filasBloque(bl, medias, {abierto: true, media: true}); });
  h += '</div>';
  if (perfilId === 'mio') h += editorPesos();
  h += '<h3>Funciones ordenadas por el perfil</h3><div class="pp-alt b-' + nodo.rama + '">' + rk.map(function (r, i) {
    return '<div class="fila"><span class="pos">' + (i + 1) + '</span><button class="btn" type="button" data-ir="' + esc(r.h.rid) + '">' + esc(r.h.nombre) + '</button>' +
      (r.p ? barra(r.p.valor) + '<span class="pb-v">' + fmt(r.p.valor) + '</span>' : '<span></span><span></span>') + '</div>'; }).join('') + '</div>';
  d.innerHTML = h; d.scrollTop = 0; enlazarPesos(d);
  d.onclick = function (ev) { var go = ev.target.closest('button[data-ir]'); if (go && porNombre[go.dataset.ir]) seleccionar(porNombre[go.dataset.ir], true); };
  return true;
}

/* ---------- tema ---------- */
var temas = ['auto', 'light', 'dark'], tema = 'auto';
function aplicarTema() {
  var r = document.documentElement; if (tema === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', tema);
  $('#tema').textContent = {auto: '◐', light: '☀', dark: '☾'}[tema];
  $('#tema').title = 'Tema: ' + {auto: 'automático', light: 'claro', dark: 'oscuro'}[tema] + ' (clic para cambiar)';
}
try { var gt = localStorage.getItem('arbol-tema'); if (temas.indexOf(gt) >= 0) tema = gt; } catch (e) {}
$('#tema').onclick = function () { tema = temas[(temas.indexOf(tema) + 1) % 3]; try { localStorage.setItem('arbol-tema', tema); } catch (e) {} aplicarTema(); };
aplicarTema();

coincide = {}; detalleVacio(); medir(); migas();
var hash = decodeURIComponent((location.hash || '').slice(1));

else cerebro.mostrar();

  var h2 = decodeURIComponent((location.hash || '').slice(1));
  if (h2 && porNombre[h2] && porNombre[h2] !== sel) seleccionar(porNombre[h2], true);
});
})();
